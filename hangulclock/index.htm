<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <!-- 홈 화면 웹앱 -->
  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
        content="black">

  <meta name="apple-mobile-web-app-title"
        content="한글시계">

  <!-- SEO -->
  <title>Korean Hangul Word Clock - 한글 시계</title>

  <meta name="description"
        content="A simple Korean Hangul word clock that displays the current date and time in Korean words.">

  <style>

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      color: #fff;

      overflow: hidden;

      font-family:
        "Apple SD Gothic Neo",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }


    /*
     * 전체 시계
     */

    #container {
      position: absolute;

      left: 0;
      top: 50%;

      width: 100%;

      text-align: center;

      -webkit-transform: translateY(-50%);
      transform: translateY(-50%);
    }


    /*
     * 날짜
     */

    #date {
      display: block;

      width: 100%;

      white-space: nowrap;

      text-align: center;

      font-size: 60px;

      margin-bottom: 25px;
    }


    .date-number {
      font-size: 1em;

      font-weight: bold;

      color: #fff;

      display: inline-block;
    }


    .date-unit {
      font-size: 0.667em;

      font-weight: normal;

      color: #999;

      display: inline-block;
    }


    .date-space {
      margin-right: 0.5em;
    }



    /*
     * 시간
     */

    #clock {
      display: block;

      width: 100%;

      white-space: nowrap;

      text-align: center;

      font-size: 100px;
    }


    .number {
      font-size: 1em;

      font-weight: bold;

      color: #fff;

      display: inline-block;
    }


    .unit {
      font-size: 0.667em;

      font-weight: normal;

      color: #999;

      display: inline-block;
    }


    .period {
      margin-right: 0.5em;
    }


    .hour-unit {
      margin-right: 0.5em;
    }



    /*
     * 설정 버튼
     */

    #settingsButton {
      position: absolute;

      top: 12px;
      right: 12px;

      width: 42px;
      height: 42px;

      padding: 0;

      border: 0;

      background: transparent;

      color: #777;

      font-size: 23px;

      line-height: 42px;

      text-align: center;

      cursor: pointer;

      z-index: 20;

      -webkit-appearance: none;
    }



    /*
     * 설정창
     */

    #settingsPanel {
      display: none;

      position: absolute;

      top: 12px;
      right: 12px;

      width: 220px;

      padding: 18px;

      background: #222;

      color: #fff;

      border: 1px solid #444;

      z-index: 30;

      font-size: 16px;

      text-align: left;
    }


    #settingsTitle {
      font-size: 18px;
      font-weight: bold;

      margin-bottom: 18px;
    }


    .settingRow {
      margin-bottom: 18px;
    }


    .settingLabel {
      display: inline-block;

      width: 155px;
    }


    /*
     * iOS 5에서도 기본 체크박스 사용
     */

    .settingCheckbox {
      width: 18px;
      height: 18px;

      vertical-align: middle;
    }


    /*
     * 모드 버튼
     */

    .modeButton {
      border: 1px solid #666;

      background: transparent;

      color: #fff;

      padding: 7px 11px;

      margin-right: 4px;

      font-size: 14px;

      -webkit-appearance: none;
    }


    #closeSettings {
      width: 100%;

      margin-top: 5px;

      padding: 9px 0;

      border: 1px solid #666;

      background: transparent;

      color: #fff;

      font-size: 14px;

      -webkit-appearance: none;
    }


    /*
     * Light mode
     */

    body.lightMode {
      background: #fff;
      color: #000;
    }


    body.lightMode .number,
    body.lightMode .date-number {
      color: #000;
    }


    body.lightMode .unit,
    body.lightMode .date-unit {
      color: #777;
    }


    body.lightMode #settingsButton {
      color: #888;
    }


    body.lightMode #settingsPanel {
      background: #f1f1f1;

      color: #000;

      border-color: #ccc;
    }


    body.lightMode .modeButton,
    body.lightMode #closeSettings {
      color: #000;

      border-color: #aaa;
    }

  </style>
</head>


<body>


  <!-- 설정 버튼 -->

  <button id="settingsButton"
          onclick="openSettings();">
    &#9881;
  </button>



  <!-- 설정창 -->

  <div id="settingsPanel">


    <div id="settingsTitle">
      설정
    </div>


    <div class="settingRow">

      <span class="settingLabel">
        날짜 표시
      </span>

      <input type="checkbox"
             id="dateToggle"
             class="settingCheckbox"
             checked="checked"
             onclick="changeDateSetting();">

    </div>


    <div class="settingRow">

      <span class="settingLabel">
        오전/오후 표시
      </span>

      <input type="checkbox"
             id="periodToggle"
             class="settingCheckbox"
             checked="checked"
             onclick="changePeriodSetting();">

    </div>


    <div class="settingRow">

      <div style="margin-bottom:10px;">
        화면 모드
      </div>

      <button class="modeButton"
              onclick="setDarkMode();">
        다크
      </button>

      <button class="modeButton"
              onclick="setLightMode();">
        라이트
      </button>

    </div>


    <button id="closeSettings"
            onclick="closeSettings();">
      닫기
    </button>


  </div>



  <!-- 시계 -->

  <div id="container">


    <!-- 날짜 -->

    <div id="date"><span id="year" class="date-number"></span><span class="date-unit date-space">년</span><span id="month" class="date-number"></span><span class="date-unit date-space">월</span><span id="day" class="date-number"></span><span class="date-unit date-space">일</span><span id="weekday" class="date-number"></span><span class="date-unit">요일</span></div>



    <!-- 시간 -->

    <div id="clock"><span id="period" class="unit period"></span><span id="hour" class="number"></span><span class="unit hour-unit">시</span><span id="minute" class="number"></span><span class="unit">분</span></div>


  </div>



  <script type="text/javascript">


    /*
     * iOS 5 호환을 위해
     * const / let 대신 var 사용
     */


    var hours = [
      "열두",
      "한",
      "두",
      "세",
      "네",
      "다섯",
      "여섯",
      "일곱",
      "여덟",
      "아홉",
      "열",
      "열한"
    ];


    var digits = [
      "",
      "일",
      "이",
      "삼",
      "사",
      "오",
      "육",
      "칠",
      "팔",
      "구"
    ];


    var weekdays = [
      "일",
      "월",
      "화",
      "수",
      "목",
      "금",
      "토"
    ];



    function numberToKorean(number) {


      if (number === 0) {
        return "영";
      }


      if (number < 10) {
        return digits[number];
      }


      if (number < 100) {


        var tens =
          Math.floor(number / 10);


        var ones =
          number % 10;


        var result = "";


        if (tens === 1) {
          result = "십";
        }
        else {
          result =
            digits[tens] + "십";
        }


        if (ones > 0) {
          result +=
            digits[ones];
        }


        return result;

      }


      if (number < 1000) {


        var hundreds =
          Math.floor(number / 100);


        var rest =
          number % 100;


        var resultHundred = "";


        if (hundreds === 1) {
          resultHundred = "백";
        }
        else {
          resultHundred =
            digits[hundreds] + "백";
        }


        if (rest > 0) {
          resultHundred +=
            numberToKorean(rest);
        }


        return resultHundred;

      }


      if (number < 10000) {


        var thousands =
          Math.floor(number / 1000);


        var remainder =
          number % 1000;


        var resultThousand = "";


        if (thousands === 1) {
          resultThousand = "천";
        }
        else {
          resultThousand =
            digits[thousands] + "천";
        }


        if (remainder > 0) {
          resultThousand +=
            numberToKorean(remainder);
        }


        return resultThousand;

      }


      return "";

    }



    /*
     * 화면 너비에 맞게 글자 크기 조절
     */

    function fitElement(
      elementId,
      targetRatio,
      baseSize
    ) {


      var element =
        document.getElementById(elementId);


      element.style.fontSize =
        baseSize + "px";


      var test =
        document.createElement("span");


      test.style.position =
        "absolute";


      test.style.visibility =
        "hidden";


      test.style.whiteSpace =
        "nowrap";


      test.style.fontSize =
        baseSize + "px";


      test.innerHTML =
        element.innerHTML;


      document.body.appendChild(test);


      var textWidth =
        test.offsetWidth;


      document.body.removeChild(test);


      if (textWidth <= 0) {
        return;
      }


      var targetWidth =
        document.documentElement.clientWidth *
        targetRatio;


      var newSize =
        baseSize *
        (targetWidth / textWidth);


      element.style.fontSize =
        newSize + "px";

    }



    function fitClock() {

      fitElement(
        "clock",
        0.90,
        100
      );

    }


    function fitDate() {


      if (
        document.getElementById("date").style.display
        !== "none"
      ) {

        fitElement(
          "date",
          0.80,
          60
        );

      }

    }



    /*
     * 현재 날짜와 시간
     */

    function updateClock() {


      var now =
        new Date();


      var year =
        now.getFullYear();


      var month =
        now.getMonth() + 1;


      var day =
        now.getDate();


      var weekday =
        weekdays[now.getDay()];


      document.getElementById("year").innerHTML =
        numberToKorean(year);


      document.getElementById("month").innerHTML =
        numberToKorean(month);


      document.getElementById("day").innerHTML =
        numberToKorean(day);


      document.getElementById("weekday").innerHTML =
        weekday;



      var hour24 =
        now.getHours();


      var hour =
        hour24 % 12;


      var minute =
        now.getMinutes();


      var period;


      if (hour24 < 12) {
        period = "오전";
      }
      else {
        period = "오후";
      }


      document.getElementById("period").innerHTML =
        period;


      document.getElementById("hour").innerHTML =
        hours[hour];


      document.getElementById("minute").innerHTML =
        numberToKorean(minute);


      fitDate();

      fitClock();

    }



    /*
     * 설정창
     */

    function openSettings() {

      document.getElementById(
        "settingsPanel"
      ).style.display = "block";


      document.getElementById(
        "settingsButton"
      ).style.display = "none";

    }


    function closeSettings() {

      document.getElementById(
        "settingsPanel"
      ).style.display = "none";


      document.getElementById(
        "settingsButton"
      ).style.display = "block";

    }



    /*
     * 날짜 표시 / 숨기기
     */

    function changeDateSetting() {


      var checkbox =
        document.getElementById(
          "dateToggle"
        );


      var date =
        document.getElementById(
          "date"
        );


      if (checkbox.checked) {

        date.style.display =
          "block";

      }
      else {

        date.style.display =
          "none";

      }


      fitClock();

    }



    /*
     * 오전 / 오후 표시
     */

    function changePeriodSetting() {


      var checkbox =
        document.getElementById(
          "periodToggle"
        );


      var period =
        document.getElementById(
          "period"
        );


      if (checkbox.checked) {

        period.style.display =
          "inline-block";

      }
      else {

        period.style.display =
          "none";

      }


      fitClock();

    }



    /*
     * 다크 모드
     */

    function setDarkMode() {

      document.body.className = "";

    }



    /*
     * 라이트 모드
     */

    function setLightMode() {

      document.body.className =
        "lightMode";

    }



    /*
     * 실행
     */

    updateClock();



    /*
     * 30초마다 업데이트
     */

    window.setInterval(
      updateClock,
      30000
    );



    /*
     * 화면 회전
     */

    window.onresize =
      function() {

        fitDate();
        fitClock();

      };


    window.onorientationchange =
      function() {

        window.setTimeout(
          function() {

            fitDate();
            fitClock();

          },
          300
        );

      };


  </script>


</body>
</html>
